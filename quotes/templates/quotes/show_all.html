<!-- quotes/show_all.html -->

{% extends 'quotes/base.html' %}

    {% block content %}
        <h1>All Quotes and Images</h1> <br> <br>

        <h2>Quotes</h2>
        {% for quote in quotes %}
            <p>{{ quote }}</p>
        {% endfor %}
        <br><br>

        <h2>Images</h2>
        {% for image in images %}
            <img src="{{ image }}" alt="">
        {% endfor %}

    {% endblock %}
